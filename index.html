<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客户邀请统计</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
--bg: #e8f0e9;
--surface: #f2f7f2;
--surface2: #e2ece3;
--border: #c5d8c7;
--border-light: #b0c9b2;
--accent: #4a8c5c;
--accent2: #3a7a6a;
--accent3: #c87c3a;
--r1: #3a7dbf;
--r2: #5a9a5a;
--r3: #c87c3a;
--r4: #7c5cbf;
--r5: #bf5c7c;
--r6: #3a9a9a;
--r7: #9a7a3a;
--r8: #6a7a8a;
--text: #2d3d2e;
--text2: #5a7260;
--text3: #8aaa8c;
--danger: #c0392b;
--success: #2e7d45;
--radius: 10px;
--shadow: 0 2px 16px rgba(60,90,65,0.10);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
background: var(--bg);
color: var(--text);
font-family: 'Noto Sans SC', sans-serif;
min-height: 100vh;
padding: 32px 16px;
background-image:
radial-gradient(ellipse at 15% 15%, rgba(74,140,92,0.08) 0%, transparent 55%),
radial-gradient(ellipse at 85% 85%, rgba(58,122,106,0.07) 0%, transparent 55%);
}
.container { max-width: 1080px; margin: 0 auto; }
.header { display: flex; align-items: center; margin-bottom: 26px; gap: 14px; }
.title-icon {
width: 46px; height: 46px;
background: linear-gradient(135deg, var(--accent), var(--accent2));
border-radius: 13px; display: flex; align-items: center; justify-content: center;
font-size: 22px; box-shadow: 0 3px 12px rgba(74,140,92,0.25); flex-shrink: 0;
}
h1 { font-size: 21px; font-weight: 700; color: var(--text); }
.subtitle { color: var(--text2); font-size: 13px; margin-top: 3px; }

.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; margin-bottom: 20px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; box-shadow: var(--shadow); transition: border-color 0.2s; }
.card:hover { border-color: var(--border-light); }
.card-label { font-size: 11px; color: var(--text2); margin-bottom: 4px; font-weight: 500; white-space: nowrap; }
.card-value { font-size: 21px; font-weight: 700; font-family: 'DM Mono', monospace; }
.card-value.r1 { color: var(--r1); } .card-value.r2 { color: var(--r2); } .card-value.r3 { color: var(--r3); }
.card-value.r4 { color: var(--r4); } .card-value.r5 { color: var(--r5); } .card-value.r6 { color: var(--r6); }
.card-value.r7 { color: var(--r7); } .card-value.r8 { color: var(--r8); }
.card-value.total { color: var(--text); }

/* Toolbar */
.toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 15px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; font-family: inherit; transition: all 0.18s; line-height: 1; }
.btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; box-shadow: 0 2px 8px rgba(74,140,92,0.25); }
.btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }
.btn-outline { background: transparent; border: 1px solid var(--border-light); color: var(--text2); }
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }
.btn-copy { background: var(--surface2); border: 1px solid var(--border-light); color: var(--accent3); margin-left: auto; }
.btn-copy:hover { background: var(--accent3); color: #fff; border-color: var(--accent3); }

.sort-note { font-size: 11px; color: var(--text3); margin-left: 2px; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 3px 9px; }

/* Search bar */
.search-bar {
display: flex; align-items: center; gap: 0;
background: var(--surface); border: 1.5px solid var(--border);
border-radius: 9px; overflow: hidden;
margin-bottom: 14px;
box-shadow: var(--shadow);
transition: border-color 0.2s;
}
.search-bar:focus-within { border-color: var(--accent); }
.search-icon {
padding: 0 12px; color: var(--text3); font-size: 16px;
display: flex; align-items: center; flex-shrink: 0;
background: var(--surface2); height: 38px;
border-right: 1px solid var(--border);
}
.search-input {
flex: 1; border: none; background: transparent;
color: var(--text); font-family: 'DM Mono', monospace; font-size: 13px;
padding: 0 12px; height: 38px; outline: none; min-width: 60px;
}
.search-input::placeholder { color: var(--text3); font-family: 'Noto Sans SC', sans-serif; font-size: 13px; }
.search-clear {
padding: 0 12px; height: 38px; background: transparent; border: none;
color: var(--text3); cursor: pointer; font-size: 16px;
display: none; align-items: center; transition: color 0.15s;
}
.search-clear.visible { display: flex; }
.search-clear:hover { color: var(--danger); }
.search-meta {
font-size: 12px; color: var(--text2); padding: 0 12px; height: 38px;
display: flex; align-items: center; white-space: nowrap;
border-left: 1px solid var(--border); background: var(--surface2);
font-family: 'DM Mono', monospace;
}
.search-meta.hidden { display: none; }

/* Table */
.table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow-x: auto; overflow-y: hidden; box-shadow: var(--shadow); }
table { width: 100%; border-collapse: collapse; min-width: 900px; }
thead th { background: var(--surface2); padding: 10px 8px; font-size: 11px; font-weight: 600; color: var(--text2); text-align: left; border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.7px; white-space: nowrap; }
thead th:nth-child(3) { color: var(--r1); } thead th:nth-child(4) { color: var(--r2); } thead th:nth-child(5) { color: var(--r3); }
thead th:nth-child(6) { color: var(--r4); } thead th:nth-child(7) { color: var(--r5); } thead th:nth-child(8) { color: var(--r6); }
thead th:nth-child(9) { color: var(--r7); } thead th:nth-child(10) { color: var(--r8); }

tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: rgba(74,140,92,0.05); }
td { padding: 9px 8px; font-size: 14px; vertical-align: middle; }

.rank-badge { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text3); font-weight: 600; }

.cell-edit { background: transparent; border: 1px solid transparent; border-radius: 6px; color: var(--text); font-family: inherit; font-size: 14px; padding: 4px 7px; width: 100%; transition: border-color 0.18s, background 0.18s; }
.cell-edit:focus { outline: none; border-color: var(--accent); background: rgba(74,140,92,0.07); }
.cell-name { font-family: 'DM Mono', monospace; font-size: 13px; }
.cell-num { text-align: center; padding-left: 4px; padding-right: 4px; }
.r1-val { color: var(--r1); } .r2-val { color: var(--r2); } .r3-val { color: var(--r3); }
.r4-val { color: var(--r4); } .r5-val { color: var(--r5); } .r6-val { color: var(--r6); }
.r7-val { color: var(--r7); } .r8-val { color: var(--r8); }
.row-total { font-family: 'DM Mono', monospace; font-weight: 700; color: var(--text); font-size: 15px; text-align: center; }

.stepper { display: flex; align-items: center; gap: 2px; justify-content: center; }
.step-btn { width: 20px; height: 20px; border-radius: 6px; border: 1px solid var(--border-light); background: var(--surface2); color: var(--text2); cursor: pointer; font-size: 13px; line-height: 1; display: flex; align-items: center; justify-content: center; transition: all 0.15s; flex-shrink: 0; padding: 0; }
.step-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(74,140,92,0.08); }
.step-val { width: 26px; text-align: center; font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; background: transparent; border: none; color: inherit; cursor: default; }

.del-btn { background: transparent; border: none; cursor: pointer; color: var(--text3); font-size: 16px; width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.del-btn:hover { background: rgba(192,57,43,0.1); color: var(--danger); }

/* Highlight matched text */
.hl { background: rgba(200,124,58,0.25); border-radius: 3px; padding: 0 1px; color: var(--accent3); font-weight: 600; }

.note-cell { min-width: 100px; }
.note-tags-inline { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.note-tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 20px; border: 1px solid var(--border-light); background: var(--surface2); color: var(--text3); font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.18s; user-select: none; white-space: nowrap; }
.note-tag:hover { border-color: var(--accent3); color: var(--accent3); background: rgba(200,124,58,0.08); }
.note-tag.active { background: rgba(200,124,58,0.12); border-color: var(--accent3); color: var(--accent3); }

.empty { padding: 44px; text-align: center; color: var(--text3); font-size: 14px; }
.empty-icon { font-size: 34px; margin-bottom: 10px; }
.no-results { padding: 36px; text-align: center; color: var(--text3); font-size: 14px; }
.no-results-icon { font-size: 30px; margin-bottom: 8px; }

.toast { position: fixed; bottom: 28px; right: 28px; background: var(--success); color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; transform: translateY(10px); transition: all 0.25s; z-index: 999; box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
.toast.show { opacity: 1; transform: translateY(0); }
.toast.warn { background: #c0392b; }

.overlay { display: none; position: fixed; inset: 0; background: rgba(45,61,46,0.45); backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center; }
.overlay.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border-light); border-radius: 14px; padding: 26px 26px 22px; width: 380px; max-width: calc(100vw - 32px); box-shadow: 0 16px 48px rgba(45,61,46,0.2); animation: pop 0.2s ease; }
@keyframes pop { from { transform: scale(0.93); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal h3 { font-size: 16px; margin-bottom: 16px; color: var(--text); }
.form-group { margin-bottom: 12px; }
.form-group label { font-size: 12px; color: var(--text2); margin-bottom: 5px; display: block; font-weight: 500; }
.form-group input { width: 100%; background: var(--surface2); border: 1px solid var(--border-light); border-radius: 8px; color: var(--text); font-family: inherit; font-size: 14px; padding: 8px 11px; transition: border-color 0.18s; }
.form-group input:focus { outline: none; border-color: var(--accent); }
.form-group input.error { border-color: var(--danger); background: rgba(192,57,43,0.06); }
.form-error { font-size: 11px; color: var(--danger); margin-top: 4px; display: none; }
.form-error.show { display: block; }
.modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

/* R1-R8 inputs grid in modal */
.r-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 12px; }
.r-grid .form-group { margin-bottom: 0; }
.r-grid .form-group label { font-family: 'DM Mono', monospace; font-weight: 600; }
.r-grid .form-group:nth-child(1) label { color: var(--r1); }
.r-grid .form-group:nth-child(2) label { color: var(--r2); }
.r-grid .form-group:nth-child(3) label { color: var(--r3); }
.r-grid .form-group:nth-child(4) label { color: var(--r4); }
.r-grid .form-group:nth-child(5) label { color: var(--r5); }
.r-grid .form-group:nth-child(6) label { color: var(--r6); }
.r-grid .form-group:nth-child(7) label { color: var(--r7); }
.r-grid .form-group:nth-child(8) label { color: var(--r8); }

@media(max-width:600px) {
.summary { grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 8px; }
.card-value { font-size: 18px; }
.stepper { gap: 2px; }
.step-btn { width: 18px; height: 18px; font-size: 11px; }
.step-val { width: 22px; font-size: 12px; }
td { padding: 7px 4px; font-size: 12px; }
thead th { padding: 8px 4px; font-size: 10px; }
.r-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<div class="container">

<div class="header">
<div class="title-icon">📊</div>
<div>
<h1>客户邀请统计</h1>
<div class="subtitle">管理每位客户的 R1 - R8 邀请数据，按邀请总数自动排序</div>
</div>
</div>

<div class="summary">
<div class="card"><div class="card-label">客户总数</div><div class="card-value total" id="sum-customers">0</div></div>
<div class="card"><div class="card-label">R1 总计</div><div class="card-value r1" id="sum-r1">0</div></div>
<div class="card"><div class="card-label">R2 总计</div><div class="card-value r2" id="sum-r2">0</div></div>
<div class="card"><div class="card-label">R3 总计</div><div class="card-value r3" id="sum-r3">0</div></div>
<div class="card"><div class="card-label">R4 总计</div><div class="card-value r4" id="sum-r4">0</div></div>
<div class="card"><div class="card-label">R5 总计</div><div class="card-value r5" id="sum-r5">0</div></div>
<div class="card"><div class="card-label">R6 总计</div><div class="card-value r6" id="sum-r6">0</div></div>
<div class="card"><div class="card-label">R7 总计</div><div class="card-value r7" id="sum-r7">0</div></div>
<div class="card"><div class="card-label">R8 总计</div><div class="card-value r8" id="sum-r8">0</div></div>
<div class="card"><div class="card-label">邀请总量</div><div class="card-value total" id="sum-total">0</div></div>
</div>

<div class="toolbar">
<button class="btn btn-primary" onclick="openModal()">＋ 添加客户</button>
<button class="btn btn-outline" onclick="clearAll()">🗑 清空</button>
<span class="sort-note">↓ 按邀请总数排序</span>
<button class="btn btn-copy" onclick="copyData()">📋 复制数据</button>
</div>

<!-- Search bar -->
<div class="search-bar">
<div class="search-icon">🔍</div>
<input class="search-input" id="search-input" type="text"
placeholder="搜索客户编号（支持后4位或完整编号）…"
oninput="onSearch(this.value)" />
<button class="search-clear" id="search-clear" onclick="clearSearch()" title="清除搜索">✕</button>
<div class="search-meta hidden" id="search-meta"></div>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th style="width:44px">排名</th>
<th>客户编号</th>
<th style="width:82px;text-align:center">R1</th>
<th style="width:82px;text-align:center">R2</th>
<th style="width:82px;text-align:center">R3</th>
<th style="width:82px;text-align:center">R4</th>
<th style="width:82px;text-align:center">R5</th>
<th style="width:82px;text-align:center">R6</th>
<th style="width:82px;text-align:center">R7</th>
<th style="width:82px;text-align:center">R8</th>
<th style="width:52px;text-align:center">合计</th>
<th>备注</th>
<th style="width:38px"></th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
<div class="empty" id="empty-state">
<div class="empty-icon">🌿</div>
暂无数据，点击「添加客户」开始统计
</div>
<div class="no-results" id="no-results" style="display:none;">
<div class="no-results-icon">🔎</div>
未找到匹配的客户，请检查编号是否正确
</div>
</div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="closeModal(event)">
<div class="modal">
<h3>添加客户</h3>
<div class="form-group">
<label>客户编号（完整）</label>
<input type="text" id="inp-name" placeholder="例如：CUST00012345" autocomplete="off" />
<div class="form-error" id="dup-error">⚠ 该账号已存在，请勿重复添加</div>
</div>
<div class="r-grid">
<div class="form-group"><label>R1 数量</label><input type="number" id="inp-r1" value="0" min="0" /></div>
<div class="form-group"><label>R2 数量</label><input type="number" id="inp-r2" value="0" min="0" /></div>
<div class="form-group"><label>R3 数量</label><input type="number" id="inp-r3" value="0" min="0" /></div>
<div class="form-group"><label>R4 数量</label><input type="number" id="inp-r4" value="0" min="0" /></div>
<div class="form-group"><label>R5 数量</label><input type="number" id="inp-r5" value="0" min="0" /></div>
<div class="form-group"><label>R6 数量</label><input type="number" id="inp-r6" value="0" min="0" /></div>
<div class="form-group"><label>R7 数量</label><input type="number" id="inp-r7" value="0" min="0" /></div>
<div class="form-group"><label>R8 数量</label><input type="number" id="inp-r8" value="0" min="0" /></div>
</div>
<div class="modal-btns">
<button class="btn btn-outline" onclick="closeModal()">取消</button>
<button class="btn btn-primary" onclick="addCustomer()">确认添加</button>
</div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
const NOTE_OPTIONS = [
{ key: 'xiaohao',      label: '小号',    icon: '👤' },
{ key: 'zhenshikehu', label: '真实客户', icon: '✅' },
];

// R1-R8 字段定义
const R_KEYS = ['r1','r2','r3','r4','r5','r6','r7','r8'];

let data = JSON.parse(localStorage.getItem('cust_stats') || '[]');
let searchQuery = '';

function save() { localStorage.setItem('cust_stats', JSON.stringify(data)); }

function getLast4(name) {
const s = String(name).replace(/\s/g, '');
return s.length >= 4 ? s.slice(-4) : s.padStart(4, '*');
}

function totalOf(row) {
let t = 0;
R_KEYS.forEach(k => { t += row[k] || 0; });
return t;
}

function getSortedIndices() {
return data
.map((row, i) => ({ i, total: totalOf(row) }))
.sort((a, b) => b.total - a.total)
.map(x => x.i);
}

// Highlight matched substring in name
function highlightMatch(name, query) {
if (!query) return escHtml(name);
const escaped = escHtml(name);
const q = escHtml(query.trim());
if (!q) return escaped;
// Match full name or last-4 position
const idx = escaped.toLowerCase().indexOf(q.toLowerCase());
if (idx === -1) return escaped;
return escaped.slice(0, idx)
+ `<span class="hl">${escaped.slice(idx, idx + q.length)}</span>`
+ escaped.slice(idx + q.length);
}

// Filter: matches if name contains query, or last4 contains query
function matchesSearch(name, query) {
if (!query) return true;
const q = query.trim().toLowerCase();
if (!q) return true;
const n = name.toLowerCase();
const last4 = getLast4(name).toLowerCase();
return n.includes(q) || last4.includes(q);
}

function render() {
const tbody = document.getElementById('tbody');
const empty = document.getElementById('empty-state');
const noResults = document.getElementById('no-results');
tbody.innerHTML = '';

if (data.length === 0) {
  empty.style.display = 'block';
  noResults.style.display = 'none';
  updateSummary();
  return;
}
empty.style.display = 'none';

const sorted = getSortedIndices();
const q = searchQuery.trim();

// Filter to matching indices (keep global rank from sorted)
const filtered = sorted
  .map((dataIdx, rank) => ({ dataIdx, rank }))
  .filter(({ dataIdx }) => matchesSearch(data[dataIdx].name, q));

if (filtered.length === 0 && q) {
  noResults.style.display = 'block';
  updateSearchMeta(0, sorted.length);
  updateSummary();
  return;
}
noResults.style.display = 'none';

if (q) updateSearchMeta(filtered.length, sorted.length);
else updateSearchMeta(null);

filtered.forEach(({ dataIdx, rank }) => {
  const row = data[dataIdx];
  const total = totalOf(row);
  const rankNum = rank + 1;
  const rankLabel = rankNum <= 3
    ? ['🥇','🥈','🥉'][rankNum-1]
    : `<span style="font-size:12px;color:var(--text3);font-family:'DM Mono',monospace">${String(rankNum).padStart(2,'0')}</span>`;

  const tagsHtml = NOTE_OPTIONS.map(opt =>
    `<div class="note-tag ${row.noteTag===opt.key?'active':''}" onclick="selectNoteTag(${dataIdx},'${opt.key}')">${opt.icon} ${opt.label}</div>`
  ).join('');

  // Highlighted name for display
  const displayName = highlightMatch(row.name, q);

  // R1-R8 stepper cells
  const rCells = R_KEYS.map(k => `
    <td class="cell-num"><div class="stepper">
      <button class="step-btn" onclick="step(${dataIdx},'${k}',-1)">−</button>
      <div class="step-val ${k}-val">${row[k]||0}</div>
      <button class="step-btn" onclick="step(${dataIdx},'${k}',1)">＋</button>
    </div></td>`).join('');

  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td style="text-align:center">${rankLabel}</td>
    <td>
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="font-family:'DM Mono',monospace;font-size:13px;flex:1;">${displayName}</span>
        <input class="cell-edit cell-name" value="${escHtml(row.name)}"
          onchange="updateField(${dataIdx},'name',this.value)"
          placeholder="客户编号"
          style="display:none;width:100%;" />
        <button onclick="toggleEditName(this,${dataIdx})"
          style="background:transparent;border:1px solid var(--border-light);border-radius:5px;padding:2px 7px;font-size:11px;color:var(--text3);cursor:pointer;white-space:nowrap;font-family:inherit;transition:all 0.15s;"
          onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'"
          onmouseout="this.style.borderColor='var(--border-light)';this.style.color='var(--text3)'"
        >编辑</button>
      </div>
    </td>
    ${rCells}
    <td class="row-total">${total}</td>
    <td class="note-cell"><div class="note-tags-inline">${tagsHtml}</div></td>
    <td><button class="del-btn" onclick="deleteRow(${dataIdx})" title="删除">✕</button></td>
  `;
  tbody.appendChild(tr);
});

updateSummary();
}

// Toggle inline name editing
function toggleEditName(btn, dataIdx) {
const td = btn.closest('td');
const span = td.querySelector('span');
const input = td.querySelector('input');
const isEditing = input.style.display !== 'none';
if (isEditing) {
// Save
updateField(dataIdx, 'name', input.value);
btn.textContent = '编辑';
} else {
span.style.display = 'none';
input.style.display = 'block';
input.focus();
btn.textContent = '保存';
}
}

function onSearch(val) {
searchQuery = val;
const clearBtn = document.getElementById('search-clear');
clearBtn.classList.toggle('visible', val.length > 0);
render();
}

function clearSearch() {
document.getElementById('search-input').value = '';
searchQuery = '';
document.getElementById('search-clear').classList.remove('visible');
updateSearchMeta(null);
render();
document.getElementById('search-input').focus();
}

function updateSearchMeta(matched, total) {
const el = document.getElementById('search-meta');
if (matched === null) {
el.classList.add('hidden');
} else {
el.classList.remove('hidden');
el.textContent = `${matched} / ${total}`;
}
}

function selectNoteTag(i, key) {
data[i].noteTag = (data[i].noteTag === key) ? '' : key;
save(); render();
}

function updateSummary() {
const sums = {};
R_KEYS.forEach(k => { sums[k] = 0; });
data.forEach(d => { R_KEYS.forEach(k => { sums[k] += d[k] || 0; }); });
document.getElementById('sum-customers').textContent = data.length;
R_KEYS.forEach(k => { document.getElementById('sum-' + k).textContent = sums[k]; });
document.getElementById('sum-total').textContent = R_KEYS.reduce((a, k) => a + sums[k], 0);
}

function updateField(i, field, val) {
if (field === 'name') {
const trimmed = val.trim();
if (!trimmed) return;
const dup = data.some((d, idx) => idx !== i && d.name.trim().toLowerCase() === trimmed.toLowerCase());
if (dup) { showToast('⚠ 账号已存在，请勿重复', true); return; }
data[i][field] = trimmed;
} else {
data[i][field] = parseInt(val)||0;
}
save(); render();
}

function step(i, field, delta) {
data[i][field] = Math.max(0, (data[i][field]||0) + delta);
save(); render();
}

function deleteRow(i) { data.splice(i, 1); save(); render(); }

function clearAll() {
if (!data.length) return;
if (confirm('确认清空所有数据？')) { data=[]; save(); clearSearch(); render(); showToast('已清空所有数据'); }
}

function openModal() {
document.getElementById('inp-name').value = '';
R_KEYS.forEach(k => { document.getElementById('inp-' + k).value = '0'; });
document.getElementById('inp-name').classList.remove('error');
document.getElementById('dup-error').classList.remove('show');
document.getElementById('overlay').classList.add('open');
setTimeout(() => document.getElementById('inp-name').focus(), 100);
}
function closeModal(e) {
if (!e || e.target === document.getElementById('overlay'))
document.getElementById('overlay').classList.remove('open');
}

function checkDup() {
const val = document.getElementById('inp-name').value.trim().toLowerCase();
const dup = val && data.some(d => d.name.trim().toLowerCase() === val);
document.getElementById('inp-name').classList.toggle('error', dup);
document.getElementById('dup-error').classList.toggle('show', dup);
return dup;
}

function addCustomer() {
const name = document.getElementById('inp-name').value.trim();
if (!name) { document.getElementById('inp-name').focus(); return; }
if (checkDup()) { showToast('⚠ 账号已存在，请检查', true); return; }
const entry = { name, noteTag: '' };
R_KEYS.forEach(k => {
entry[k] = parseInt(document.getElementById('inp-' + k).value) || 0;
});
data.push(entry);
save(); render();
document.getElementById('overlay').classList.remove('open');
showToast('客户已添加 ✓');
}

function copyData() {
if (!data.length) { showToast('暂无数据可复制'); return; }
const sorted = getSortedIndices();
const lines = sorted.map(i => {
const row = data[i];
const t = totalOf(row);
const parts = R_KEYS.map(k => `${k.toUpperCase()}: ${row[k]||0}`).join('  ');
return `${getLast4(row.name)}  ${parts}  Jumlah: ${t}`;
});
const text = lines.join('\n');
if (navigator.clipboard) {
navigator.clipboard.writeText(text).then(() => showToast('Berjaya disalin ✓'));
} else {
const ta = document.createElement('textarea');
ta.value = text; document.body.appendChild(ta); ta.select();
document.execCommand('copy'); document.body.removeChild(ta);
showToast('Berjaya disalin ✓');
}
}

function showToast(msg, warn) {
const t = document.getElementById('toast');
t.textContent = msg;
t.className = 'toast' + (warn ? ' warn' : '');
t.classList.add('show');
setTimeout(() => t.classList.remove('show'), 2500);
}

function escHtml(s) {
return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.addEventListener('keydown', e => {
if (e.key === 'Enter' && document.getElementById('overlay').classList.contains('open')) addCustomer();
if (e.key === 'Escape') {
if (document.getElementById('overlay').classList.contains('open')) closeModal();
else if (searchQuery) clearSearch();
}
// Ctrl/Cmd + F focuses search
if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
if (!document.getElementById('overlay').classList.contains('open')) {
e.preventDefault();
document.getElementById('search-input').focus();
}
}
});

window.addEventListener('load', () => {
document.getElementById('inp-name').addEventListener('input', checkDup);
});

render();
</script>
</body>
</html>
